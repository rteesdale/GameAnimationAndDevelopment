<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#131315"/>
  <rect x="0" y="0" width="1280" height="88" fill="#202129"/>
  <rect x="52" y="28" width="34" height="34" transform="rotate(45 69 45)" fill="#ffcc33"/>
  <rect x="66" y="42" width="34" height="34" transform="rotate(45 83 59)" fill="#ff5b57"/>
  <text x="112" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f4f1e8">Pulse Run Level Editor</text>
  <text x="64" y="145" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffcc33">6. Export your level</text>
  <text x="68" y="194" font-family="Arial, sans-serif" font-size="27" fill="#c7c2b6">Export JSON turns your design into level data.</text>
  <g font-family="Arial, sans-serif">
    <text x="82" y="260" font-size="30" fill="#f4f1e8">• Copy the JSON to save your level.</text>
<text x="82" y="316" font-size="30" fill="#f4f1e8">• Paste JSON back in with Import</text>
<text x="82" y="354" font-size="30" fill="#f4f1e8">  JSON.</text>
<text x="82" y="410" font-size="30" fill="#f4f1e8">• Submit exported JSON when asked in</text>
<text x="82" y="448" font-size="30" fill="#f4f1e8">  Classroom.</text>
    
        <g transform="translate(690 225)">
          <rect x="0" y="0" width="430" height="250" rx="10" fill="#15161b" stroke="#5f626e"/>
          <rect x="24" y="24" width="150" height="44" rx="6" fill="#252434" stroke="#45d9e8"/>
          <text x="44" y="53" font-size="20" fill="#f4f1e8">Export JSON</text>
          <rect x="24" y="88" width="382" height="132" rx="6" fill="#101116" stroke="#444957"/>
          <text x="44" y="122" font-size="18" fill="#82dc73">{</text>
          <text x="66" y="152" font-size="18" fill="#f4f1e8">"objects": [ ... ]</text>
          <text x="44" y="182" font-size="18" fill="#82dc73">}</text>
        </g>
  </g>
  <text x="64" y="668" font-family="Arial, sans-serif" font-size="22" fill="#82dc73">JSON is your portable level file.</text>
</svg>